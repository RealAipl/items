name: Unzip items.zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove old extracted folder
        run: |
          rm -rf items

      - name: Unzip items.zip
        run: |
          unzip -o items.zip -d items

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add items
          git commit -m "Extract minecraft item icons" || echo "No changes"
          git push
